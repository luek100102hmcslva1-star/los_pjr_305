<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="encabezado">
        <h1>Portal Escolar</h1>
        <nav class="menu">
            <a href="/principal">Inicio</a>
            <a href="/logout">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta-operacion" style="width: 500px; max-width: 90%;">
            <h2>Panel del Alumno</h2>
            
            <div style="background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
                <p><strong>Nombre:</strong> {{ usuario }}</p>
                <p><strong>Número de Control:</strong> {{ control }}</p>
                <p><strong>Correo Electrónico:</strong> {{ email }}</p>
            </div>

            <div style="border: 2px dashed #0f4c81; background: #ffffff; padding: 25px; border-radius: 10px; text-align: center;">
                <h3 style="color: #0f4c81; margin-top: 0;">Credencial Digital</h3>
                <p style="font-size: 18px; margin-bottom: 5px;"><strong>{{ usuario }}</strong></p>
                <p style="margin-top: 0;">Control: <strong>{{ control }}</strong></p>
                
                <div style="width: 120px; height: 120px; background: #e0e0e0; margin: 15px auto; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
                    <span style="font-size: 12px; color: #555;">[Espacio QR]</span>
                </div>

                <p style="color: #2e7d32; font-weight: bold; margin-bottom: 0;">ESTADO: ACTIVO</p>
            </div>
        </section>
    </main>
</body>
</html>
